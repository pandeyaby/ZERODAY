name: ZERODAY locate gate
description: >
  Keyless localization CI gate — fixture (default), rules, or org cassette replay.
  SARIF upload + reviewable PR comment. No model weights, no HF pull, no GPU.
  Live Antares / --endpoint is never supported here (workstation opt-in only).
  Never auto-merges. Localization ≠ exploitability.
  On pull_request, posting the findings comment is fail-closed (not optional soft-fail).
inputs:
  mode:
    description: >
      Locate door: fixture (default CI smoke) | rules (authorized repo snapshot) |
      recording (org cassette replay). Live / endpoint refused.
    required: false
    default: fixture
  cwe:
    description: CWE id for fixture/rules localization (e.g. CWE-89). Ignored for recording.
    required: false
    default: CWE-89
  repo:
    description: Path to scan (fixture demo-app by default; set to checkout root for rules)
    required: false
    default: fixtures/locate/demo-app
  recording:
    description: Org cassette path when mode=recording (zeroday-org-cassette/v1)
    required: false
    default: ""
  output:
    description: Report output directory
    required: false
    default: zeroday-reports/ci
  fail-on-findings:
    description: >
      If true, fail the job AFTER SARIF upload + PR comment when candidates exist.
      Failure means "review localization candidates" — not exploitability proof.
    required: false
    default: "false"
  upload-sarif:
    description: Upload report.sarif to GitHub Code Scanning
    required: false
    default: "true"
  post-comment:
    description: >
      Post (or update) a PR comment with ranked files + evidence.
      On pull_request this is fail-closed when true — job fails if comment cannot be posted.
    required: false
    default: "true"
  run-unit-tests:
    description: >
      Run npm test before locate. Default true for this repo's CI; set false when
      consuming the Action from an org workflow that already tested elsewhere.
    required: false
    default: "true"
  sarif-category:
    description: Code Scanning category for this upload
    required: false
    default: zeroday-antares
  working-directory:
    description: >
      Directory that contains package.json / the ZERODAY CLI (default `.`).
      When ZERODAY is checked out to a subdirectory (e.g. `_zeroday`), set this
      so npm ci / locate run there while `repo` can still point at the consumer tree.
    required: false
    default: "."
outputs:
  sarif-path:
    description: Path to report.sarif
    value: ${{ steps.locate.outputs.sarif-path }}
  finding-count:
    description: Number of ranked candidate files
    value: ${{ steps.locate.outputs.finding-count }}
  comment-path:
    description: Path to comment.md
    value: ${{ steps.locate.outputs.comment-path }}
  locate-mode:
    description: Resolved locate mode (fixture | rules | recording)
    value: ${{ steps.locate.outputs.locate-mode }}

runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "22"
        cache: npm
        cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json

    - name: Install dependencies
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: npm ci

    - name: Unit tests (locate + Desk UI surfaces)
      if: inputs.run-unit-tests == 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        set -euo pipefail
        # Full suite includes tests/desk/{reports,live-endpoint,console}.test.ts
        # (UI-2 reports + UI-3 live-endpoint). Dedicated desk-ui CI job also runs
        # npm run test:desk for visible PR coverage.
        npm test

    - name: Keyless locate (fixture | rules | recording — never live)
      id: locate
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        CWE: ${{ inputs.cwe }}
        REPO: ${{ inputs.repo }}
        OUT: ${{ inputs.output }}
        RECORDING: ${{ inputs.recording }}
        ZERODAY_GATE_MODE: ${{ inputs.mode }}
      run: |
        set -euo pipefail
        mkdir -p "$OUT"
        RESOLVED="$(node "${{ github.action_path }}/resolve-locate-cmd.js")"
        EXPECTED_MODE="$(node -e "const j=JSON.parse(process.argv[1]);process.stdout.write(j.expectedMode)" "$RESOLVED")"
        LABEL="$(node -e "const j=JSON.parse(process.argv[1]);process.stdout.write(j.label)" "$RESOLVED")"
        # Explicit keyless doors only. Never --endpoint / --live in CI (no weights / no spend).
        node -e "
          const {spawnSync}=require('child_process');
          const j=JSON.parse(process.argv[1]);
          const r=spawnSync('npm', j.argv, {stdio:'inherit', env:process.env});
          process.exit(r.status===null?1:r.status);
        " "$RESOLVED"
        test -f "$OUT/report.sarif"
        test -f "$OUT/report.json"
        test -f "$OUT/comment.md"
        # Fail closed before GitHub API: comment must carry ranked findings (or empty result).
        grep -E 'Ranked candidate files|No vulnerable files submitted' "$OUT/comment.md" >/dev/null
        grep -F 'Human review required' "$OUT/comment.md" >/dev/null
        MODE="$(node -e "const fs=require('fs');const r=JSON.parse(fs.readFileSync(process.env.OUT+'/report.json','utf8'));process.stdout.write(r.mode)")"
        test "$MODE" = "$EXPECTED_MODE"
        COUNT="$(node -e "const fs=require('fs');const r=JSON.parse(fs.readFileSync(process.env.OUT+'/report.json','utf8'));process.stdout.write(String(r.summary.findingCount))")"
        # Absolute paths so upload-sarif / PR comment work when working-directory ≠ workspace root
        ABS_OUT="$(node -e "process.stdout.write(require('path').resolve(process.env.OUT))")"
        echo "sarif-path=$ABS_OUT/report.sarif" >> "$GITHUB_OUTPUT"
        echo "comment-path=$ABS_OUT/comment.md" >> "$GITHUB_OUTPUT"
        echo "json-path=$ABS_OUT/report.json" >> "$GITHUB_OUTPUT"
        echo "finding-count=$COUNT" >> "$GITHUB_OUTPUT"
        echo "locate-mode=$MODE" >> "$GITHUB_OUTPUT"
        echo "ZERODAY $LABEL complete — mode=$MODE findings=$COUNT (localization only)"

    - name: Optional antares plan (no inference)
      continue-on-error: true
      if: inputs.mode == 'fixture'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        REPO: ${{ inputs.repo }}
      run: |
        set -euo pipefail
        if command -v uv >/dev/null 2>&1; then
          uv tool install cisco-antares-cli >/dev/null
          export PATH="$(uv tool dir --bin):$PATH"
        fi
        if command -v antares >/dev/null 2>&1; then
          npm run zeroday -- plan "$REPO" --max-cwes 5 --format json | head -c 4000
        else
          echo "cisco-antares-cli not on PATH — skipping plan (locate fixture already ran)"
        fi

    - name: Upload SARIF to GitHub Code Scanning
      if: inputs.upload-sarif == 'true'
      continue-on-error: true
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: ${{ steps.locate.outputs.sarif-path }}
        category: ${{ inputs.sarif-category }}

    - name: Post reviewable PR comment
      id: pr-comment
      if: inputs.post-comment == 'true' && github.event_name == 'pull_request'
      uses: actions/github-script@v7
      env:
        COMMENT_PATH: ${{ steps.locate.outputs.comment-path }}
      with:
        script: |
          const path = require('path');
          const post = require(path.join(process.env.GITHUB_ACTION_PATH, 'post-pr-comment.js'));
          await post({ github, context, core });

    - name: Fail closed if PR comment step broke
      if: >-
        always() &&
        inputs.post-comment == 'true' &&
        github.event_name == 'pull_request' &&
        steps.pr-comment.outcome == 'failure'
      shell: bash
      run: |
        echo "::error title=ZERODAY PR comment failed::post-comment is required on pull_request. Job fails closed — every PR must get a visible ranked-findings comment (keyless locate is fine; no GPU)."
        exit 1

    - name: Summarize for Actions UI
      shell: bash
      env:
        COUNT: ${{ steps.locate.outputs.finding-count }}
        SARIF: ${{ steps.locate.outputs.sarif-path }}
        LOCATE_MODE: ${{ steps.locate.outputs.locate-mode }}
      run: |
        {
          echo "## ZERODAY locate gate"
          echo ""
          echo "- Mode: **${LOCATE_MODE}** (keyless — never live / never auto-spend)"
          echo "- Findings (localization candidates): **${COUNT}**"
          echo "- SARIF: \`${SARIF}\`"
          echo "- Also written: asff / splunk / xsoar / fortisiem / crowdstrike local projections"
          echo "- Posture: detector-lane candidate · localization only · not exploitability proof · no auto-merge"
          echo "- Live Antares: workstation opt-in only after human GPU spend approval"
          echo "- PR comment: fail-closed on \`pull_request\` when \`post-comment=true\`"
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Reviewable fail-on-findings (optional)
      if: inputs.fail-on-findings == 'true' && steps.locate.outputs.finding-count != '0'
      shell: bash
      run: |
        echo "::error title=ZERODAY localization review::${{ steps.locate.outputs.finding-count }} ranked candidate file(s) for human review. This is NOT proof of exploitability. SARIF + PR comment were published. No auto-merge."
        exit 1
