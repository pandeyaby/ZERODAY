name: ZERODAY locate gate
description: >
  Keyless localization CI gate — fixture (default), rules, or org cassette replay.
  SARIF upload + reviewable PR comment. No model weights, no HF pull, no GPU.
  Live Antares / --endpoint is never supported here (workstation opt-in only).
  Never auto-merges. Localization ≠ exploitability.
  On pull_request, posting the findings comment is fail-closed (not optional soft-fail).
inputs:
  mode:
    description: >
      Locate door: fixture (default CI smoke) | rules (authorized repo snapshot) |
      recording (org cassette replay). Live / endpoint refused.
    required: false
    default: fixture
  cwe:
    description: CWE id for fixture/rules localization (e.g. CWE-89). Ignored for recording.
    required: false
    default: CWE-89
  repo:
    description: Path to scan (fixture demo-app by default; set to checkout root for rules)
    required: false
    default: fixtures/locate/demo-app
  recording:
    description: Org cassette path when mode=recording (zeroday-org-cassette/v1)
    required: false
    default: ""
  output:
    description: Report output directory
    required: false
    default: zeroday-reports/ci
  fail-on-findings:
    description: >
      If true, fail the job AFTER SARIF upload + PR comment when candidates exist.
      Failure means "review localization candidates" — not exploitability proof.
    required: false
    default: "false"
  upload-sarif:
    description: Upload report.sarif to GitHub Code Scanning
    required: false
    default: "true"
  post-comment:
    description: >
      Post (or update) a PR comment with ranked files + evidence.
      On pull_request this is fail-closed when true — job fails if comment cannot be posted.
    required: false
    default: "true"
  run-unit-tests:
    description: >
      Run ZERODAY's own test suite before locate (ZERODAY's CI sets this; other
      repositories should leave it off).
    required: false
    default: "false"
  advisory:
    description: >
      CVE-… or GHSA-… id (mode=rules). Adds dependency matching: affected package
      versions in your lockfiles and calls to the vulnerable functions. Takes
      precedence over `cwe`.
    required: false
    default: ""
  baseline:
    description: Earlier report.json (or its directory). Findings are marked new / unchanged; fail-on-findings counts only new ones.
    required: false
    default: ""
  changed-since:
    description: >
      Git ref (e.g. origin/main). Keep findings in files changed since the merge
      base. Needs history: actions/checkout with fetch-depth 0.
    required: false
    default: ""
  offline:
    description: >
      auto (default) = CWE scans offline, CVE / GHSA scans read public advisory
      metadata from api.osv.dev (source code is never sent); true = never fetch.
    required: false
    default: auto
  sarif-category:
    description: Code Scanning category for this upload
    required: false
    default: zeroday-antares
  working-directory:
    description: >
      Deprecated (kept for compatibility): the Action now runs the ZERODAY CLI
      from its own copy, so callers no longer check ZERODAY out. Paths (`repo`,
      `output`, `baseline`) are relative to the caller's workspace.
    required: false
    default: "."
outputs:
  sarif-path:
    description: Path to report.sarif
    value: ${{ steps.locate.outputs.sarif-path }}
  finding-count:
    description: Number of ranked candidate files
    value: ${{ steps.locate.outputs.finding-count }}
  new-finding-count:
    description: Findings not in the baseline (equals finding-count without a baseline)
    value: ${{ steps.locate.outputs.new-finding-count }}
  comment-path:
    description: Path to comment.md
    value: ${{ steps.locate.outputs.comment-path }}
  locate-mode:
    description: Resolved locate mode (fixture | rules | recording)
    value: ${{ steps.locate.outputs.locate-mode }}

runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "22"

    - name: Install the ZERODAY CLI (from the Action's own copy)
      id: cli
      shell: bash
      run: |
        set -euo pipefail
        # uses: pandeyaby/ZERODAY/.github/actions/zeroday-locate-gate@<ref> ships the
        # whole ZERODAY repo at <ref>; the CLI runs from there, not from the caller's tree.
        ROOT="$(cd "${{ github.action_path }}/../../.." && pwd)"
        VERSION="$(node -p "require('$ROOT/package.json').version")"
        if [ -d "$ROOT/node_modules/tsx" ]; then
          echo "Using existing ZERODAY install at $ROOT"
          echo "cmd=node $ROOT/bin/zeroday.mjs" >> "$GITHUB_OUTPUT"
        elif npm view "zeroday-cli@$VERSION" version >/dev/null 2>&1; then
          # Released version: the published CLI package (small, no Next.js).
          PREFIX="$RUNNER_TEMP/zeroday-cli"
          npm install --prefix "$PREFIX" --no-audit --no-fund --loglevel=error "zeroday-cli@$VERSION"
          echo "cmd=node $PREFIX/node_modules/zeroday-cli/bin/zeroday.mjs" >> "$GITHUB_OUTPUT"
        else
          # Unreleased ref: install the checkout's own dependencies.
          (cd "$ROOT" && npm ci --no-audit --no-fund --loglevel=error)
          echo "cmd=node $ROOT/bin/zeroday.mjs" >> "$GITHUB_OUTPUT"
        fi
        echo "root=$ROOT" >> "$GITHUB_OUTPUT"
        echo "ZERODAY $VERSION ready"

    - name: Unit tests (ZERODAY's own CI)
      if: inputs.run-unit-tests == 'true'
      shell: bash
      working-directory: ${{ steps.cli.outputs.root }}
      run: |
        set -euo pipefail
        [ -d node_modules/tsx ] || npm ci --no-audit --no-fund --loglevel=error
        npm test

    - name: Keyless locate (fixture | rules | recording — never live)
      id: locate
      shell: bash
      env:
        CWE: ${{ inputs.cwe }}
        ADVISORY: ${{ inputs.advisory }}
        REPO: ${{ inputs.repo }}
        OUT: ${{ inputs.output }}
        RECORDING: ${{ inputs.recording }}
        BASELINE: ${{ inputs.baseline }}
        CHANGED_SINCE: ${{ inputs.changed-since }}
        OFFLINE: ${{ inputs.offline }}
        ZERODAY_GATE_MODE: ${{ inputs.mode }}
        ZERODAY_ROOT: ${{ steps.cli.outputs.root }}
        ZERODAY_CMD: ${{ steps.cli.outputs.cmd }}
      run: |
        set -euo pipefail
        # Bundled fixtures (fixture mode default) live in the Action's copy, not the caller's tree.
        if [ ! -e "$REPO" ] && [ -e "$ZERODAY_ROOT/$REPO" ]; then REPO="$ZERODAY_ROOT/$REPO"; fi
        if [ -n "$RECORDING" ] && [ ! -e "$RECORDING" ] && [ -e "$ZERODAY_ROOT/$RECORDING" ]; then RECORDING="$ZERODAY_ROOT/$RECORDING"; fi
        export REPO RECORDING
        mkdir -p "$OUT"
        RESOLVED="$(node "${{ github.action_path }}/resolve-locate-cmd.js")"
        EXPECTED_MODE="$(node -e "const j=JSON.parse(process.argv[1]);process.stdout.write(j.expectedMode)" "$RESOLVED")"
        LABEL="$(node -e "const j=JSON.parse(process.argv[1]);process.stdout.write(j.label)" "$RESOLVED")"
        # Explicit keyless doors only. Never --endpoint / --live in CI (no weights / no spend).
        # Exit 2 = NOT SCANNED (no rules for the CWE) — fail closed.
        node -e "
          const {spawnSync}=require('child_process');
          const j=JSON.parse(process.argv[1]);
          const [bin, ...pre]=process.env.ZERODAY_CMD.split(' ');
          const r=spawnSync(bin, [...pre, ...j.cliArgs], {stdio:'inherit', env:process.env});
          process.exit(r.status===null?1:r.status);
        " "$RESOLVED"
        test -f "$OUT/report.sarif"
        test -f "$OUT/report.json"
        test -f "$OUT/comment.md"
        # Fail closed before GitHub API: comment must carry ranked findings (or an explicit empty / not-scanned result).
        grep -E 'Ranked candidate files|No vulnerable files submitted|\*\*Not scanned\*\*' "$OUT/comment.md" >/dev/null
        grep -F 'Human review required' "$OUT/comment.md" >/dev/null
        MODE="$(node -e "const fs=require('fs');const r=JSON.parse(fs.readFileSync(process.env.OUT+'/report.json','utf8'));process.stdout.write(r.mode)")"
        test "$MODE" = "$EXPECTED_MODE"
        COUNT="$(node -e "const fs=require('fs');const r=JSON.parse(fs.readFileSync(process.env.OUT+'/report.json','utf8'));process.stdout.write(String(r.summary.findingCount))")"
        NEW="$(node -e "const fs=require('fs');const r=JSON.parse(fs.readFileSync(process.env.OUT+'/report.json','utf8'));process.stdout.write(String(r.summary.baseline ? r.summary.baseline.new : r.summary.findingCount))")"
        # Absolute paths so upload-sarif / PR comment work from any directory
        ABS_OUT="$(node -e "process.stdout.write(require('path').resolve(process.env.OUT))")"
        echo "sarif-path=$ABS_OUT/report.sarif" >> "$GITHUB_OUTPUT"
        echo "comment-path=$ABS_OUT/comment.md" >> "$GITHUB_OUTPUT"
        echo "json-path=$ABS_OUT/report.json" >> "$GITHUB_OUTPUT"
        echo "finding-count=$COUNT" >> "$GITHUB_OUTPUT"
        echo "new-finding-count=$NEW" >> "$GITHUB_OUTPUT"
        echo "locate-mode=$MODE" >> "$GITHUB_OUTPUT"
        echo "ZERODAY $LABEL complete — mode=$MODE findings=$COUNT new=$NEW (localization only)"

    - name: Optional antares plan (no inference)
      continue-on-error: true
      if: inputs.mode == 'fixture'
      shell: bash
      env:
        REPO: ${{ inputs.repo }}
        ZERODAY_CMD: ${{ steps.cli.outputs.cmd }}
        ZERODAY_ROOT: ${{ steps.cli.outputs.root }}
      run: |
        set -euo pipefail
        if [ ! -e "$REPO" ] && [ -e "$ZERODAY_ROOT/$REPO" ]; then REPO="$ZERODAY_ROOT/$REPO"; fi
        if command -v uv >/dev/null 2>&1; then
          uv tool install cisco-antares-cli >/dev/null
          export PATH="$(uv tool dir --bin):$PATH"
        fi
        if command -v antares >/dev/null 2>&1; then
          $ZERODAY_CMD plan "$REPO" --max-cwes 5 --format json | head -c 4000
        else
          echo "cisco-antares-cli not on PATH — skipping plan (locate fixture already ran)"
        fi

    - name: Upload SARIF to GitHub Code Scanning
      if: inputs.upload-sarif == 'true'
      continue-on-error: true
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: ${{ steps.locate.outputs.sarif-path }}
        category: ${{ inputs.sarif-category }}

    - name: Post reviewable PR comment
      id: pr-comment
      if: inputs.post-comment == 'true' && github.event_name == 'pull_request'
      uses: actions/github-script@v7
      env:
        COMMENT_PATH: ${{ steps.locate.outputs.comment-path }}
      with:
        script: |
          const path = require('path');
          const post = require(path.join(process.env.GITHUB_ACTION_PATH, 'post-pr-comment.js'));
          await post({ github, context, core });

    - name: Fail closed if PR comment step broke
      if: >-
        always() &&
        inputs.post-comment == 'true' &&
        github.event_name == 'pull_request' &&
        steps.pr-comment.outcome == 'failure'
      shell: bash
      run: |
        echo "::error title=ZERODAY PR comment failed::post-comment is required on pull_request. Job fails closed — every PR must get a visible ranked-findings comment (keyless locate is fine; no GPU)."
        exit 1

    - name: Summarize for Actions UI
      shell: bash
      env:
        COUNT: ${{ steps.locate.outputs.finding-count }}
        SARIF: ${{ steps.locate.outputs.sarif-path }}
        LOCATE_MODE: ${{ steps.locate.outputs.locate-mode }}
      run: |
        {
          echo "## ZERODAY locate gate"
          echo ""
          echo "- Mode: **${LOCATE_MODE}** (keyless — never live / never auto-spend)"
          echo "- Findings (localization candidates): **${COUNT}**"
          echo "- SARIF: \`${SARIF}\`"
          echo "- Also written: asff / splunk / xsoar / fortisiem / crowdstrike local projections"
          echo "- Posture: candidate for human review · localization only · not exploitability proof · no auto-merge"
          echo "- Live Antares: workstation opt-in only after human GPU spend approval"
          echo "- PR comment: fail-closed on \`pull_request\` when \`post-comment=true\`"
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Reviewable fail-on-findings (optional)
      if: inputs.fail-on-findings == 'true' && steps.locate.outputs.new-finding-count != '0'
      shell: bash
      run: |
        echo "::error title=ZERODAY localization review::${{ steps.locate.outputs.new-finding-count }} ranked candidate file(s) for human review${{ inputs.baseline != '' && ' (new since the baseline)' || '' }}. This is NOT proof of exploitability. SARIF + PR comment were published. No auto-merge."
        exit 1
