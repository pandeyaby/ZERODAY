# ZERODAY Antares localization CI gate
#
# Fixture-only smoke + keyless rules + SARIF ingest + org cassette record/replay —
# no model weights, no HF pull, no GPU. Live Antares is never in this workflow.
# Jobs: quality (tsc + lint + next build + docker build + npm pack smoke) + locate (SARIF + PR comment + npm test) + org-path (rules + cassette via
# the composite Action) + operate→verify + desk-ui (UI-2 reports + UI-3
# live-endpoint unit tests) + locate-rules (K1) + locate-ingest (K2) +
# locate-record (K3) + paired-probe / freezedry (DIPTYCH diptych_schema 0.2) +
# stranger-verify (Door A keyless + Door B citation-only; no RunPod / HF / live).
# Never auto-merges. Localization ≠ exploitability.
# Org daily-driver runbook: docs/org-ops-runbook.md · cassette: docs/cassette-runbook.md
# Paired probes: docs/paired-probes.md · docs/diptych-onepager.md
# Stranger CI trust (badge + non-claims): docs/ci-trust.md
# Badge label = this workflow `name:` (keep short / human-readable).

name: ZERODAY locate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  pull-requests: write

concurrency:
  group: zeroday-locate-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck + lint + Next.js build + Docker build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (tsc --noEmit)
        run: npx tsc --noEmit

      - name: Lint (errors fail; warnings reported)
        run: npm run lint

      - name: Next.js production build
        run: npm run build

      - name: Docker image build
        run: docker build -t zeroday:ci .

      - name: npm package (zeroday-cli) — pack + install + smoke from a clean project
        run: |
          set -euo pipefail
          node scripts/pack-cli.mjs
          tgz="$(ls "$PWD"/dist/zeroday-cli-*.tgz)"
          mkdir -p /tmp/consumer && cd /tmp/consumer
          npm init -y >/dev/null
          npm install --no-audit --no-fund "$tgz"
          npx --no-install zeroday --version
          npx --no-install zeroday mvp

  locate:
    name: CI/no-GPU fixture localize → SARIF + PR comment
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: List PR diff (context only)
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: |
          set -euo pipefail
          echo "## PR changed files (context — CI/no-GPU fixture locate uses recorded Antares run)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          git fetch origin "${{ github.base_ref }}" --depth=1 2>/dev/null || true
          git diff --name-only "origin/${{ github.base_ref }}...HEAD" | head -100 | sed 's/^/- /' >> "$GITHUB_STEP_SUMMARY" || true

      - name: ZERODAY locate gate
        uses: ./.github/actions/zeroday-locate-gate
        with:
          mode: fixture
          cwe: CWE-89
          repo: fixtures/locate/demo-app
          output: zeroday-reports/ci
          fail-on-findings: ${{ vars.ZERODAY_FAIL_ON_FINDINGS || 'false' }}
          upload-sarif: "true"
          post-comment: "true"
          sarif-category: zeroday-antares-fixture

      - name: Upload report artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zeroday-locate-reports
          path: zeroday-reports/ci/
          if-no-files-found: error

  # Org daily-driver path (Harden A): rules on a repo snapshot + cassette replay
  # via the same composite Action. No GPU. Live Antares refused.
  org-path:
    name: Org path — rules + cassette → SARIF (keyless)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: List PR diff (context only — locate uses authorized snapshot / cassette)
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: |
          set -euo pipefail
          echo "## PR changed files (context — org-path locate is keyless rules / cassette)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          git fetch origin "${{ github.base_ref }}" --depth=1 2>/dev/null || true
          git diff --name-only "origin/${{ github.base_ref }}...HEAD" | head -100 | sed 's/^/- /' >> "$GITHUB_STEP_SUMMARY" || true

      - name: Rules locate on sample tree (Action mode=rules)
        uses: ./.github/actions/zeroday-locate-gate
        with:
          mode: rules
          cwe: CWE-89
          repo: fixtures/locate/rules-sample
          output: zeroday-reports/ci-org-rules
          run-unit-tests: "false"
          upload-sarif: "true"
          post-comment: "false"
          sarif-category: zeroday-org-rules

      - name: Cassette replay (Action mode=recording)
        uses: ./.github/actions/zeroday-locate-gate
        with:
          mode: recording
          recording: fixtures/locate/org-recordings/rules-cwe-89.cassette.json
          output: zeroday-reports/ci-org-recording
          run-unit-tests: "false"
          upload-sarif: "true"
          post-comment: "false"
          sarif-category: zeroday-org-cassette

      - name: Cassette replay CI assert (npm run cassette:replay)
        run: |
          set -euo pipefail
          # Executable replay-only door with pinned outcomes (Action path already
          # uploaded SARIF; this re-asserts offline deterministically — no record).
          npm run cassette:replay -- \
            --recording fixtures/locate/org-recordings/rules-cwe-89.cassette.json \
            --output zeroday-reports/ci-org-cassette-assert \
            --expect-findings 1 \
            --expect-file src/search.js \
            --expect-cwe CWE-89
          test -f zeroday-reports/ci-org-cassette-assert/report.sarif

      - name: Summarize org-path gate
        run: |
          {
            echo "## ZERODAY org-path gate (clone → locate → SARIF)"
            echo ""
            echo "- Rules: \`fixtures/locate/rules-sample\` → \`zeroday-reports/ci-org-rules/\` (\`mode: rules\`)"
            echo "- Cassette: \`fixtures/locate/org-recordings/rules-cwe-89.cassette.json\` → \`zeroday-reports/ci-org-recording/\` (\`mode: recording\`)"
            echo "- CI assert: \`npm run cassette:replay\` → \`zeroday-reports/ci-org-cassette-assert/\` (findings=1 · src/search.js)"
            echo "- Posture: keyless · localization only · not exploit proof · no auto-merge · no live GPU"
            echo "- Runbook: \`docs/org-ops-runbook.md\` · cassette: \`docs/cassette-runbook.md\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload org-path artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zeroday-org-path-reports
          path: |
            zeroday-reports/ci-org-rules/
            zeroday-reports/ci-org-recording/
            zeroday-reports/ci-org-cassette-assert/
          if-no-files-found: error

  operate:
    name: Fixture operate → verify (keyless)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fixture operate (no weights / no GPU)
        run: |
          set -euo pipefail
          mkdir -p zeroday-reports/ci-operate
          npm run zeroday -- operate --cwe CWE-89 --fixture --offline \
            --output zeroday-reports/ci-operate
          test -f zeroday-reports/ci-operate/report.json
          test -f zeroday-reports/ci-operate/report.sarif
          test -f zeroday-reports/ci-operate/evidence/manifest.json

      - name: Verify evidence vault (fail on hash/schema errors)
        run: |
          set -euo pipefail
          npm run zeroday -- verify --from zeroday-reports/ci-operate

      - name: Summarize operate gate
        run: |
          {
            echo "## ZERODAY operate → verify gate"
            echo ""
            echo "- Mode: fixture agent operator (keyless — no Antares HF token / no GPU)"
            echo "- Output: \`zeroday-reports/ci-operate/\`"
            echo "- Verify: offline SHA-256 + manifest schema (hard-fail)"
            echo "- Posture: localization only · not exploit proof · no auto-merge"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload operate artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zeroday-operate-reports
          path: zeroday-reports/ci-operate/
          if-no-files-found: error

  desk-ui:
    name: Desk UI unit tests (UI-2 reports + UI-3 live-endpoint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Desk unit tests (path-policy + reports + live-endpoint)
        run: |
          set -euo pipefail
          # Explicit desk surface — also covered by npm test in the locate gate.
          # UI-2 reports + UI-3 live-endpoint must stay green on PRs (Mac PathPolicy
          # regression: symlinked os.tmpdir /var/folders → /private/var/folders).
          npm run test:desk

      - name: Summarize desk-ui gate
        run: |
          {
            echo "## ZERODAY Desk UI unit tests"
            echo ""
            echo "- Suite: \`npm run test:desk\` → \`tests/desk/**/*.test.ts\`"
            echo "- Covers: **UI-2** reports browser + cassette record/replay"
            echo "- Covers: **UI-3** live-endpoint wizard (save/load sandbox, doctor, spend/remote ACK)"
            echo "- PathPolicy: symlink cwd canonicalize (macOS tmpdir-safe); escape outside cwd still 403"
            echo "- Also runs via \`npm test\` in the locate gate — this job makes Desk UI coverage visible"
          } >> "$GITHUB_STEP_SUMMARY"

  inventory:
    name: Fixture multi-repo inventory (Desk slice B)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Multi-repo inventory (fixture only)
        run: |
          set -euo pipefail
          npm run zeroday -- inventory --from fixtures/inventory/desk-b/manifest.json \
            --output zeroday-reports/ci-inventory
          test -f zeroday-reports/ci-inventory/inventory.json
          test -f zeroday-reports/ci-inventory/inventory.md
          test -f zeroday-reports/ci-inventory/inventory.sarif
          test -f zeroday-reports/ci-inventory/case-note.md
          test -f zeroday-reports/ci-inventory/repos/webuzz/inventory.json
          # Explicit --fixture door (same desk-b manifest)
          npm run zeroday -- inventory --fixture \
            --output zeroday-reports/ci-inventory-fixture-flag
          test -f zeroday-reports/ci-inventory-fixture-flag/inventory.json
          node -e '
            const j = require("./zeroday-reports/ci-inventory/inventory.json");
            if (j.schemaVersion !== "zeroday-config-inventory/v1") process.exit(2);
            if (j.repoCount < 5) process.exit(3);
            if (!j.rankedHotspots?.length) process.exit(4);
            if (!j.posture?.inventoryOnly) process.exit(5);
            if (!Array.isArray(j.findings)) process.exit(6);
            if (!j.skipped?.some((s) => s.id === "EternalEcho")) process.exit(7);
            const blob = JSON.stringify(j.findings);
            if (/sk_[A-Za-z0-9]{10,}/.test(blob)) process.exit(8);
            console.log("inventory fixture OK", j.repoCount, "repos", j.findings.length, "findings", j.skipped.length, "skipped");
          '

      - name: Summarize inventory gate
        run: |
          {
            echo "## ZERODAY inventory gate (Desk slice B)"
            echo ""
            echo "- Mode: fixture multi-repo + config surfaces (no GPU / no HF)"
            echo "- Output: \`zeroday-reports/ci-inventory/\`"
            echo "- Feeds locate — not exploit scanning"
            echo "- Posture: inventory only · localization only · no PoC · no auto-merge"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload inventory artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zeroday-inventory-reports
          path: zeroday-reports/ci-inventory/
          if-no-files-found: error

  desk-real:
    name: Desk on real-shaped path (Keyless K5)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Inventory → packet → harden on real-shaped tree (no Antares)
        run: |
          set -euo pipefail
          # Mirrors: cd my-app && npm run zeroday -- inventory
          npm run zeroday -- inventory --repo fixtures/inventory/real-shaped \
            --output zeroday-reports/ci-desk-real-inv
          test -f zeroday-reports/ci-desk-real-inv/inventory.json
          test -f zeroday-reports/ci-desk-real-inv/inventory.sarif
          # Default --from resolution prefers zeroday-reports/
          npm run zeroday -- packet --output zeroday-reports/ci-desk-real-packet
          test -f zeroday-reports/ci-desk-real-packet/packet.json
          npm run zeroday -- harden --from zeroday-reports/ci-desk-real-packet \
            --output zeroday-reports/ci-desk-real-harden
          test -f zeroday-reports/ci-desk-real-harden/harden.json
          node -e '
            const inv = require("./zeroday-reports/ci-desk-real-inv/inventory.json");
            if (!inv.configHotspots?.length) process.exit(2);
            const pkt = require("./zeroday-reports/ci-desk-real-packet/packet.json");
            if (pkt.schemaVersion !== "zeroday-security-packet/v1") process.exit(3);
            const h = require("./zeroday-reports/ci-desk-real-harden/harden.json");
            if (h.schemaVersion !== "zeroday-harden-recommendations/v1") process.exit(4);
            console.log("desk-real OK", inv.configHotspots.length, "hotspots", pkt.findings.length, "findings");
          '

      - name: Summarize desk-real gate
        run: |
          {
            echo "## ZERODAY Desk on real path (Keyless K5)"
            echo ""
            echo "- Mode: inventory/packet/harden against \`fixtures/inventory/real-shaped\` (mirrors cwd usage)"
            echo "- No Antares · no PoC · Desk ≠ vuln discovery"
            echo "- Fixture smoke unchanged: \`inventory --fixture\` / \`npm run mvp\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload desk-real artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zeroday-desk-real-reports
          path: |
            zeroday-reports/ci-desk-real-inv/
            zeroday-reports/ci-desk-real-packet/
            zeroday-reports/ci-desk-real-harden/
          if-no-files-found: error

  locate-rules:
    name: Rules locate on sample tree (Keyless K1)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: locate --rules CWE-89 (no GPU / no HF / no Semgrep)
        run: |
          set -euo pipefail
          npm run zeroday -- locate --cwe CWE-89 \
            --repo fixtures/locate/rules-sample --rules --offline \
            --output zeroday-reports/ci-locate-rules
          test -f zeroday-reports/ci-locate-rules/report.json
          test -f zeroday-reports/ci-locate-rules/report.sarif
          test -f zeroday-reports/ci-locate-rules/evidence/manifest.json
          node -e '
            const fs = require("fs");
            const j = JSON.parse(fs.readFileSync("zeroday-reports/ci-locate-rules/report.json", "utf8"));
            if (j.mode !== "rules") process.exit(2);
            if (!j.rankedFiles?.length) process.exit(3);
            if (!j.posture?.localizationOnly || !j.posture?.noPoC) process.exit(4);
            const warn = (j.warnings || []).join(" ");
            if (!/not Antares/i.test(warn)) process.exit(5);
            const sarif = JSON.parse(fs.readFileSync("zeroday-reports/ci-locate-rules/report.sarif", "utf8"));
            if (sarif.runs?.[0]?.properties?.mode !== "rules") process.exit(6);
            console.log("locate-rules OK", j.rankedFiles.length, "findings", j.mode);
          '

      - name: Mixed flags fail closed
        run: |
          set -euo pipefail
          set +e
          npm run zeroday -- locate --cwe CWE-89 --repo fixtures/locate/rules-sample \
            --rules --fixture --output zeroday-reports/ci-locate-rules-mix
          code=$?
          set -e
          test "$code" -ne 0
          test ! -f zeroday-reports/ci-locate-rules-mix/report.json

      - name: Summarize locate-rules gate
        run: |
          {
            echo "## ZERODAY locate --rules gate (Keyless K1)"
            echo ""
            echo "- Mode: thin in-repo CWE-89 heuristics on \`fixtures/locate/rules-sample\`"
            echo "- Output: \`zeroday-reports/ci-locate-rules/\` (\`mode: \"rules\"\`)"
            echo "- Not Antares F1 · not exploitability · no Semgrep · mvp/fixture unchanged"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload locate-rules artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zeroday-locate-rules-reports
          path: zeroday-reports/ci-locate-rules/
          if-no-files-found: error

  locate-ingest:
    name: SARIF ingest sample (Keyless K2)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: locate --from-sarif (no GPU / no HF / no network fetch)
        run: |
          set -euo pipefail
          npm run zeroday -- locate \
            --from-sarif fixtures/locate/ingest-sample/sample.sarif \
            --cwe CWE-89 --offline \
            --output zeroday-reports/ci-locate-ingest
          test -f zeroday-reports/ci-locate-ingest/report.json
          test -f zeroday-reports/ci-locate-ingest/report.sarif
          test -f zeroday-reports/ci-locate-ingest/evidence/manifest.json
          node -e '
            const fs = require("fs");
            const j = JSON.parse(fs.readFileSync("zeroday-reports/ci-locate-ingest/report.json", "utf8"));
            if (j.mode !== "ingest") process.exit(2);
            if (!j.rankedFiles?.length) process.exit(3);
            if (!j.posture?.localizationOnly || !j.posture?.noPoC) process.exit(4);
            const warn = (j.warnings || []).join(" ");
            if (!/not Antares/i.test(warn)) process.exit(5);
            if (!/third-party|SARIF/i.test(warn)) process.exit(6);
            const sarif = JSON.parse(fs.readFileSync("zeroday-reports/ci-locate-ingest/report.sarif", "utf8"));
            if (sarif.runs?.[0]?.properties?.mode !== "ingest") process.exit(7);
            console.log("locate-ingest OK", j.rankedFiles.length, "findings", j.mode);
          '

      - name: Mixed flags fail closed
        run: |
          set -euo pipefail
          set +e
          npm run zeroday -- locate \
            --from-sarif fixtures/locate/ingest-sample/sample.sarif \
            --rules --output zeroday-reports/ci-locate-ingest-mix
          code=$?
          set -e
          test "$code" -ne 0
          test ! -f zeroday-reports/ci-locate-ingest-mix/report.json

      - name: Summarize locate-ingest gate
        run: |
          {
            echo "## ZERODAY locate --from-sarif gate (Keyless K2)"
            echo ""
            echo "- Mode: local SARIF 2.1 ingest on \`fixtures/locate/ingest-sample/sample.sarif\`"
            echo "- Output: \`zeroday-reports/ci-locate-ingest/\` (\`mode: \"ingest\"\`)"
            echo "- Third-party findings · not Antares/rules discovery · not exploitability"
            echo "- File path only · no GitHub alerts API · mvp/fixture/rules unchanged"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: upload-sarif --dry-run (assert script; no GitHub upload / no token)
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          # Dry-run only — validates SARIF + request shape; never calls code-scanning/sarifs.
          # Live upload needs security_events: write; CI does not require that token here.
          npm run upload-sarif -- \
            --sarif zeroday-reports/ci-locate-ingest/report.sarif \
            --repository "${{ github.repository }}" \
            --ref "refs/pull/${{ github.event.pull_request.number }}/head" \
            --commit "${{ github.event.pull_request.head.sha }}" \
            --dry-run \
            --write-request zeroday-reports/ci-locate-ingest/upload-sarif.dry-run.json
          test -f zeroday-reports/ci-locate-ingest/upload-sarif.dry-run.json
          node -e '
            const j = require("./zeroday-reports/ci-locate-ingest/upload-sarif.dry-run.json");
            if (j.dryRun !== true) process.exit(2);
            if (j.method !== "POST") process.exit(3);
            if (!String(j.endpoint || "").endsWith("/code-scanning/sarifs")) process.exit(4);
            if (!j.body?.sarif || !j.body?.commit_sha || !j.body?.ref) process.exit(5);
            if (!j.posture?.localizationOnly || !j.posture?.notExploitProof) process.exit(6);
            console.log("upload-sarif dry-run OK", j.endpoint);
          '

      - name: Upload locate-ingest artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zeroday-locate-ingest-reports
          path: zeroday-reports/ci-locate-ingest/
          if-no-files-found: error

  locate-record:
    name: record --redact org cassette (Keyless K3)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: rules locate → record --redact → locate --recording
        run: |
          set -euo pipefail
          npm run zeroday -- locate --cwe CWE-89 \
            --repo fixtures/locate/rules-sample --rules --offline \
            --output zeroday-reports/ci-locate-record-src
          test -f zeroday-reports/ci-locate-record-src/report.json
          FINDINGS=$(node -e 'const fs=require("fs");const j=JSON.parse(fs.readFileSync("zeroday-reports/ci-locate-record-src/report.json","utf8"));if(j.mode!=="rules")process.exit(2);if(!j.rankedFiles?.length)process.exit(3);process.stdout.write(String(j.rankedFiles.length));')
          echo "source findings=$FINDINGS"
          npm run zeroday -- record --from zeroday-reports/ci-locate-record-src \
            --out zeroday-reports/ci-locate-record/rules-cwe-89.cassette.json
          test -f zeroday-reports/ci-locate-record/rules-cwe-89.cassette.json
          node -e '
            const fs = require("fs");
            const c = JSON.parse(fs.readFileSync("zeroday-reports/ci-locate-record/rules-cwe-89.cassette.json", "utf8"));
            if (c.schemaVersion !== "zeroday-org-cassette/v1") process.exit(2);
            if (c.redacted !== true) process.exit(3);
            if (c.sourceMode !== "rules") process.exit(4);
            if (!c.rankedFiles?.length) process.exit(5);
            if (!c.humanReviewNote) process.exit(6);
            const blob = JSON.stringify(c);
            if (/\/workspace\//.test(blob)) process.exit(7);
            if (/\b(sk|ghp|hf)_[A-Za-z0-9_]{8,}\b/.test(blob)) process.exit(8);
            console.log("record OK", c.rankedFiles.length, "findings", c.schemaVersion);
          '
          npm run zeroday -- locate \
            --recording zeroday-reports/ci-locate-record/rules-cwe-89.cassette.json \
            --output zeroday-reports/ci-locate-record-replay
          test -f zeroday-reports/ci-locate-record-replay/report.json
          node -e '
            const fs = require("fs");
            const expected = Number(process.argv[1]);
            const j = JSON.parse(fs.readFileSync("zeroday-reports/ci-locate-record-replay/report.json", "utf8"));
            if (j.mode !== "recording") process.exit(2);
            if (j.rankedFiles?.length !== expected) process.exit(3);
            if (!j.posture?.localizationOnly || !j.posture?.noPoC) process.exit(4);
            const warn = (j.warnings || []).join(" ");
            if (!/recording|cassette/i.test(warn)) process.exit(5);
            if (!/sourceMode=rules/.test(warn)) process.exit(6);
            const sarif = JSON.parse(fs.readFileSync("zeroday-reports/ci-locate-record-replay/report.sarif", "utf8"));
            if (sarif.runs?.[0]?.properties?.mode !== "recording") process.exit(7);
            console.log("locate-recording OK", j.rankedFiles.length, "findings", j.mode);
          ' "$FINDINGS"

      - name: Committed org cassette path (fixtures/locate/org-recordings)
        run: |
          set -euo pipefail
          # Replay-only CI assert — pinned finding count / ranked file / SARIF.
          # Record stays opt-in/local (`zeroday record`); never records in CI here.
          npm run cassette:replay -- \
            --recording fixtures/locate/org-recordings/rules-cwe-89.cassette.json \
            --output zeroday-reports/ci-locate-record-committed \
            --expect-findings 1 \
            --expect-file src/search.js \
            --expect-cwe CWE-89
          test -f zeroday-reports/ci-locate-record-committed/report.json
          test -f zeroday-reports/ci-locate-record-committed/report.sarif

      - name: Mixed flags fail closed (--recording + --rules)
        run: |
          set -euo pipefail
          set +e
          npm run zeroday -- locate \
            --recording zeroday-reports/ci-locate-record/rules-cwe-89.cassette.json \
            --rules --output zeroday-reports/ci-locate-record-mix
          code=$?
          set -e
          test "$code" -ne 0
          test ! -f zeroday-reports/ci-locate-record-mix/report.json

      - name: record refuses incomplete / empty
        run: |
          set -euo pipefail
          mkdir -p zeroday-reports/ci-locate-record-bad
          node -e '
            const fs = require("fs");
            fs.writeFileSync("zeroday-reports/ci-locate-record-bad/report.json", JSON.stringify({
              mode: "rules",
              advisory: { kind: "cwe", id: "CWE-89", cweId: "CWE-89" },
              targetRepo: "/tmp/x",
              model: "rules/cwe-89",
              generatedAt: new Date().toISOString(),
              rankedFiles: [],
              explorationTrace: [],
              warnings: [],
              posture: { localizationOnly: true, notExploitProof: true, noAutoMerge: true, noPoC: true },
              summary: { findingCount: 0, incompleteReason: null, terminalCallBudget: 0, terminalCallsUsed: 0 }
            }, null, 2));
          '
          set +e
          npm run zeroday -- record --from zeroday-reports/ci-locate-record-bad \
            --out zeroday-reports/ci-locate-record-bad/out.cassette.json
          code=$?
          set -e
          test "$code" -ne 0
          test ! -f zeroday-reports/ci-locate-record-bad/out.cassette.json

      - name: Summarize locate-record gate
        run: |
          {
            echo "## ZERODAY record --redact gate (Keyless K3)"
            echo ""
            echo "- Flow: \`locate --rules\` → \`record --redact\` → \`locate --recording\`"
            echo "- Committed sample: \`fixtures/locate/org-recordings/rules-cwe-89.cassette.json\`"
            echo "- CI assert: \`npm run cassette:replay\` (pinned findings=1 · file=src/search.js · SARIF)"
            echo "- Cassette: \`zeroday-org-cassette/v1\` (redacted; human review before commit)"
            echo "- Replay \`mode: \"recording\"\` · not mvp fixtures · no auto-commit / no exfil"
            echo "- Localization ≠ exploitability · no PoC · runbook: \`docs/cassette-runbook.md\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload locate-record artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zeroday-locate-record-reports
          path: |
            zeroday-reports/ci-locate-record-src/
            zeroday-reports/ci-locate-record/
            zeroday-reports/ci-locate-record-replay/
            zeroday-reports/ci-locate-record-committed/
          if-no-files-found: error

  # DIPTYCH paired probes (diptych_schema 0.2) — FREEZEDRY…VARSCALE
  # Keyless/offline. Localization only. No GPU / HF / spend / PoC / AUROC.
  paired-probe:
    name: paired-probe / freezedry (DIPTYCH 0.2 · all 8 ops)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests (fingerprint + gating + gate_axis_mutate all 8)
        run: |
          set -euo pipefail
          npm run test:paired-probes

      - name: Emit all 8 operators × conforming/violating
        run: |
          set -euo pipefail
          npm run paired-probe -- --output zeroday-reports
          test -f zeroday-reports/paired-probe/coverage/matrix.json
          test -f zeroday-reports/paired-probe/FREEZEDRY/conforming.json
          test -f zeroday-reports/paired-probe/FREEZEDRY/violating.json
          node -e '
            const fs = require("fs");
            const m = JSON.parse(fs.readFileSync("zeroday-reports/paired-probe/coverage/matrix.json", "utf8"));
            if (m.diptych_schema !== "0.2") process.exit(2);
            const ops = Object.keys(m.operators);
            if (ops.length !== 8) process.exit(3);
            // All 8 claimed green under WITNESSES_ZERODAY uplift — conforming→pass, violating→fail
            for (const op of ops) {
              if (m.operators[op].status !== "green") process.exit(4);
              const c = JSON.parse(fs.readFileSync("zeroday-reports/paired-probe/"+op+"/conforming.json","utf8"));
              const v = JSON.parse(fs.readFileSync("zeroday-reports/paired-probe/"+op+"/violating.json","utf8"));
              if (c.expected_verdict !== "pass" || v.expected_verdict !== "fail") process.exit(5);
              if (c.traces.length < 2 || v.traces.length < 2) process.exit(6);
            }
            for (const op of ["TRAJSWAP","VARSCALE"]) {
              const c = JSON.parse(fs.readFileSync("zeroday-reports/paired-probe/"+op+"/conforming.json","utf8"));
              if (c.coupling !== "crn_closed_loop") process.exit(10);
            }
            // Shape checks for uplift witnesses
            const sf = JSON.parse(fs.readFileSync("zeroday-reports/paired-probe/SIGNFLIP/conforming.json","utf8"));
            if (sf.traces[0].meta.signflip_channel !== "score_margin") process.exit(7);
            const ts = JSON.parse(fs.readFileSync("zeroday-reports/paired-probe/TRAJSWAP/conforming.json","utf8"));
            if (!ts.traces[0].channels.closed_loop_residual?.values?.length) process.exit(8);
            const vs = JSON.parse(fs.readFileSync("zeroday-reports/paired-probe/VARSCALE/conforming.json","utf8"));
            if (typeof vs.traces[0].meta.var_scale !== "number") process.exit(9);
            const blob = JSON.stringify(m);
            if (/"auroc"\s*:/i.test(blob)) process.exit(11);
            console.log("paired-probe OK all-8 green", ops.join(","));
          '

      - name: Summarize paired-probe gate
        run: |
          {
            echo "## ZERODAY paired-probe / FREEZEDRY (DIPTYCH diptych_schema 0.2)"
            echo ""
            echo "- Emits 8×{conforming,violating} under \`zeroday-reports/paired-probe/\`"
            echo "- Green (power-on-axis + gate_axis_mutate): all 8 — FREEZEDRY · RESEED · SCHEMAX · SIGNFLIP · SATEXTEND · HISTSWAP · TRAJSWAP · VARSCALE"
            echo "- TRAJSWAP/VARSCALE coupling: \`crn_closed_loop\`"
            echo "- gate_axis_mutate: mutate conforming axis only → regrade MUST fail (enforced in \`npm run test:paired-probes\` + emit path)"
            echo "- Posture: keyless · localization only · not exploit proof · no PoC · no AUROC · no auto-merge"
            echo "- Docs: \`docs/paired-probes.md\` · \`docs/diptych-onepager.md\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload paired-probe artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zeroday-paired-probe
          path: |
            zeroday-reports/paired-probe/
            zeroday-reports/diptych-probes/
          if-no-files-found: error

  # Stranger prove-doors — Door A keyless (trust-loop) + Door B citation only.
  # No GPU / HF / RunPod / live Antares. Fails the job if stranger:verify ≠ 0.
  stranger-verify:
    name: stranger:verify (Door A keyless + Door B citation)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: npm run stranger:verify (keyless · no GPU · JSON)
        run: |
          set -euo pipefail
          # Machine-readable Door A proof card + Door B citation (not vuln/AUROC proof).
          npm run --silent stranger:verify -- --json > stranger-verify.json
          # CLI path stays zeroday-reports/trust-loop/ (TRUST_LOOP_OUT default);
          # only in-process Desk/API runs use per-run trust-loop-XXXXXX dirs.
          test -f zeroday-reports/trust-loop/paired-probe/coverage/matrix.json
          test -s stranger-verify.json
          node -e '
            const j = require("./stranger-verify.json");
            if (j.schemaVersion !== "zeroday-stranger-verify/v1") process.exit(2);
            if (j.doorA?.status !== "pass" || j.doorA?.ran !== true) process.exit(3);
            if (j.doorB?.mode !== "citation" || j.doorB?.ran !== false) process.exit(4);
          '

      - name: npm run prove-doors (keyless · A + cassette · B skipped)
        run: |
          set -euo pipefail
          # In-process Door A + cassette:replay; Door B skipped in CI (no opt-in URL).
          # --json --out → workspace prove-doors.json (uploaded below on success).
          npm run --silent prove-doors -- --json --out prove-doors.json
          test -s prove-doors.json
          node scripts/assert-prove-doors-ci-json.mjs prove-doors.json

      - name: npm run gpu-evidence (keyless · historical Measured A40 · no RunPod)
        run: |
          set -euo pipefail
          # Fail-closed load of checked-in Measured A40 evidence JSON.
          # --json --out → workspace gpu-evidence.json (uploaded below on success).
          # Validates historical evidence only — does not start RunPod / not live GPU.
          npm run --silent gpu-evidence -- --json --out gpu-evidence.json
          test -s gpu-evidence.json
          node scripts/assert-gpu-evidence-ci-json.mjs gpu-evidence.json

      - name: npm run evidence-pack (keyless · design-partner pack · no RunPod)
        run: |
          set -euo pipefail
          # Fail-closed design-partner folder from existing doors (reuse evidence-pack).
          # --json --out → out/evidence/ (uploaded below on success).
          # Historical gpu-evidence only — does not start RunPod / not live GPU.
          # Pack must include report.json + report.md (zeroday.report/v1 · runpod:false).
          npm run --silent evidence-pack -- --json --out out/evidence
          test -s out/evidence/manifest.json
          test -s out/evidence/prove-doors.json
          test -s out/evidence/gpu-evidence.json
          test -s out/evidence/report.json
          test -s out/evidence/report.md
          node scripts/assert-evidence-pack-ci-json.mjs out/evidence
          node scripts/assert-evidence-pack-report.mjs out/evidence

      - name: npm run doctor (keyless · workstation readiness · no RunPod)
        run: |
          set -euo pipefail
          # Fail-closed local workstation readiness (reuse zeroday doctor from #92).
          # --json --out → out/doctor.json (uploaded below on success).
          # Honest filesystem / package checks only — does not start RunPod / not live GPU.
          npm run --silent doctor -- --json --out out/doctor.json
          test -s out/doctor.json
          node scripts/assert-doctor-ci-json.mjs out/doctor.json

      - name: npm run report (keyless · CISO localization summary · no RunPod)
        run: |
          set -euo pipefail
          # Fail-closed CISO localization summary from checked-in prove-doors fixture (reuse #96 report CLI).
          # --json --out → out/report.json; second pass writes out/report.md (uploaded below on success).
          # Fixture/historical only — does not start RunPod / not live Antares / no PoC.
          npm run --silent report -- --from fixtures/locate/report-sample/prove-doors.json --json --out out/report.json
          npm run --silent report -- --from fixtures/locate/report-sample/prove-doors.json --out out/report.md
          test -s out/report.json
          test -s out/report.md
          node scripts/assert-report-ci-json.mjs out/report.json

      - name: Summarize stranger-verify gate
        run: |
          {
            echo "## ZERODAY stranger:verify (prove-doors)"
            echo ""
            echo "- Ran: \`npm run --silent stranger:verify -- --json\` → \`stranger-verify.json\` artifact"
            echo "- Ran: \`npm run --silent prove-doors -- --json --out prove-doors.json\` (Door A + cassette; Door B skipped)"
            echo "- Ran: \`npm run --silent gpu-evidence -- --json --out gpu-evidence.json\` (historical Measured A40; does not start RunPod)"
            echo "- Ran: \`npm run --silent evidence-pack -- --json --out out/evidence\` (design-partner pack; does not start RunPod)"
            echo "- Ran: \`npm run --silent doctor -- --json --out out/doctor.json\` (workstation readiness; does not start RunPod)"
            echo "- Ran: \`npm run --silent report -- --from fixtures/locate/report-sample/prove-doors.json --json --out out/report.json\` (+ \`--out out/report.md\`; CISO localization summary; does not start RunPod)"
            echo "- Door A: keyless \`trust-loop\` → paired-probe:from-sarif (offline fixture SARIF)"
            echo "- Door B: citation only — \`docs/gpu-claims.md\` § Live re-proof (no RunPod / HF / live Antares in CI)"
            echo "- Artifact \`stranger-verify-json\`: Door A proof card + Door B citation — **not** vuln / AUROC proof"
            echo "- Artifact \`prove-doors-json\`: aggregated A + cassette (+ B skipped) — **not** vuln / AUROC proof"
            echo "- Artifact \`gpu-evidence-json\`: checked-in Measured A40 evidence — **not** live GPU / AUROC proof"
            echo "- Artifact \`evidence-pack\`: \`out/evidence/\` (prove-doors + gpu-evidence + report.json/md + manifest) — **not** live GPU / AUROC proof"
            echo "- Artifact \`doctor\`: \`out/doctor.json\` (zeroday.doctor/v1 workstation readiness) — **not** live GPU / AUROC proof"
            echo "- Artifact \`report\`: \`out/report.json\` + \`out/report.md\` (zeroday.report/v1 localization summary) — **not** vuln / AUROC proof"
            echo "- Posture: keyless · localization only · not exploit proof · no AUROC · no auto-merge · no GPU"
            echo "- Docs: \`docs/stranger-verify.md\` · \`docs/ci-trust.md\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload stranger-verify artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zeroday-stranger-verify
          path: zeroday-reports/trust-loop/
          if-no-files-found: error

      - name: Upload stranger-verify JSON (Door A proof card)
        uses: actions/upload-artifact@v4
        with:
          name: stranger-verify-json
          path: stranger-verify.json
          if-no-files-found: error

      - name: Upload prove-doors JSON (A + cassette aggregate)
        uses: actions/upload-artifact@v4
        with:
          name: prove-doors-json
          path: prove-doors.json
          if-no-files-found: error

      - name: Upload gpu-evidence JSON (historical Measured A40)
        uses: actions/upload-artifact@v4
        with:
          name: gpu-evidence-json
          path: gpu-evidence.json
          if-no-files-found: error

      - name: Upload evidence-pack (prove-doors + gpu-evidence + report + manifest)
        uses: actions/upload-artifact@v4
        with:
          name: evidence-pack
          path: out/evidence/
          if-no-files-found: error

      - name: Upload doctor JSON (workstation readiness · no RunPod)
        uses: actions/upload-artifact@v4
        with:
          name: doctor
          path: out/doctor.json
          if-no-files-found: error

      - name: Upload report (CISO localization summary · no RunPod)
        uses: actions/upload-artifact@v4
        with:
          name: report
          path: |
            out/report.json
            out/report.md
          if-no-files-found: error

  packet:
    name: Fixture security packet (Desk slice A)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Security packet from Desk B reports (generate only)
        run: |
          set -euo pipefail
          npm run zeroday -- packet --from docs/reports \
            --output zeroday-reports/ci-packet
          test -f zeroday-reports/ci-packet/packet.json
          test -f zeroday-reports/ci-packet/summary.md
          test -f zeroday-reports/ci-packet/findings.json
          test -f zeroday-reports/ci-packet/findings.md
          test -f zeroday-reports/ci-packet/README.md
          test -f zeroday-reports/ci-packet/desk-b-inventory.sarif
          node -e '
            const j = require("./zeroday-reports/ci-packet/packet.json");
            if (j.schemaVersion !== "zeroday-security-packet/v1") process.exit(2);
            if (j.desk !== "A") process.exit(3);
            if (!j.posture?.noAutoSend) process.exit(4);
            if (!j.posture?.noPoC) process.exit(5);
            if (!Array.isArray(j.findings) || j.findings.length < 1) process.exit(6);
            const labels = new Set(["agent-misfire","config","dependency","unknown"]);
            for (const f of j.findings) {
              if (!labels.has(f.classification)) process.exit(7);
              if (!f.classificationBasis) process.exit(8);
            }
            const blob = JSON.stringify(j);
            if (/sk_[A-Za-z0-9]{10,}/.test(blob)) process.exit(9);
            if (/auto-?post|slack webhook|mailto:/i.test(blob) && /sendNow|dispatch/i.test(blob)) process.exit(10);
            console.log("packet fixture OK", j.findings.length, "findings", j.classificationCounts);
          '

      - name: Summarize packet gate
        run: |
          {
            echo "## ZERODAY security packet gate (Desk slice A)"
            echo ""
            echo "- Mode: package Desk B inventory reports → offline share folder"
            echo "- Output: \`zeroday-reports/ci-packet/\`"
            echo "- Generate only — no Slack / GH / email auto-send"
            echo "- Posture: localize + evidence + harden · no PoC · secrets redacted"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload packet artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zeroday-security-packet
          path: zeroday-reports/ci-packet/
          if-no-files-found: error

  harden:
    name: Fixture harden recommendations (Desk slice C)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Harden from Desk B reports (recommend-only)
        run: |
          set -euo pipefail
          npm run zeroday -- harden --from docs/reports \
            --output zeroday-reports/ci-harden
          test -f zeroday-reports/ci-harden/harden.json
          test -f zeroday-reports/ci-harden/harden.md
          test -f zeroday-reports/ci-harden/README.md
          test ! -d zeroday-reports/ci-harden/drafts
          node -e '
            const j = require("./zeroday-reports/ci-harden/harden.json");
            if (j.schemaVersion !== "zeroday-harden-recommendations/v1") process.exit(2);
            if (j.desk !== "C") process.exit(3);
            if (!j.posture?.recommendationsOnly) process.exit(4);
            if (!j.posture?.noAutoApply) process.exit(5);
            if (!j.posture?.noAutoPr) process.exit(6);
            if (!j.posture?.noAutoMerge) process.exit(7);
            if (!j.posture?.noPoC) process.exit(8);
            if (!Array.isArray(j.recommendations) || j.recommendations.length < 1) process.exit(9);
            if (j.draftNotes?.length) process.exit(10);
            const cats = new Set(["agent-harness","package-scripts","secrets-hygiene","config-surface"]);
            for (const r of j.recommendations) {
              if (!cats.has(r.category)) process.exit(11);
              if (!r.evidence?.findingId) process.exit(12);
            }
            const blob = JSON.stringify(j);
            if (/sk_[A-Za-z0-9]{10,}/.test(blob)) process.exit(13);
            console.log("harden fixture OK", j.recommendations.length, "recs", j.categoryCounts);
          '

      - name: Harden --draft notes (human-gated, still no auto-apply)
        run: |
          set -euo pipefail
          npm run zeroday -- harden --from docs/reports/desk-a-packet \
            --draft --output zeroday-reports/ci-harden-draft
          test -f zeroday-reports/ci-harden-draft/harden.json
          test -d zeroday-reports/ci-harden-draft/drafts
          test "$(find zeroday-reports/ci-harden-draft/drafts -name '*.md' | wc -l)" -ge 1
          node -e '
            const j = require("./zeroday-reports/ci-harden-draft/harden.json");
            if (!j.posture?.noAutoApply || !j.posture?.noAutoPr || !j.posture?.noAutoMerge) process.exit(2);
            if (!j.draftNotes?.length) process.exit(3);
            const draft = require("fs").readdirSync("zeroday-reports/ci-harden-draft/drafts")[0];
            const md = require("fs").readFileSync("zeroday-reports/ci-harden-draft/drafts/" + draft, "utf8");
            if (!/DRAFT ONLY/i.test(md)) process.exit(4);
            if (/CodeGuard-approved/i.test(md)) process.exit(5);
            if (/\b(write|craft)\s+an?\s+exploit\b/i.test(md)) process.exit(6);
            console.log("harden draft OK", j.draftNotes.length, "notes");
          '

      - name: Summarize harden gate
        run: |
          {
            echo "## ZERODAY harden gate (Desk slice C)"
            echo ""
            echo "- Mode: recommend-only from Desk B/A reports (optional --draft notes)"
            echo "- Output: \`zeroday-reports/ci-harden/\`"
            echo "- No auto-apply · no auto-PR · no auto-merge"
            echo "- Posture: localize + evidence + harden · no PoC · secrets redacted"
            echo "- mvp / inventory / packet unchanged"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload harden artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zeroday-harden-reports
          path: |
            zeroday-reports/ci-harden/
            zeroday-reports/ci-harden-draft/
          if-no-files-found: error

  classify:
    name: Fixture crash classify + evidence (Desk slice E)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Classify from fixture dir (one command)
        run: |
          set -euo pipefail
          npm run zeroday -- classify --from fixtures/classify/software_defect \
            --output zeroday-reports/ci-classify
          test -f zeroday-reports/ci-classify/classify.json
          test -f zeroday-reports/ci-classify/classify.md
          test -f zeroday-reports/ci-classify/ciso.json
          test -f zeroday-reports/ci-classify/ciso.md
          test -f zeroday-reports/ci-classify/README.md
          node -e '
            const j = require("./zeroday-reports/ci-classify/classify.json");
            if (j.schemaVersion !== "zeroday-classify-evidence/v1") process.exit(2);
            if (j.desk !== "E") process.exit(3);
            if (j.classification !== "software_defect") process.exit(4);
            if (j.needs_human !== true) process.exit(5);
            if (j.classification_not_exploitability !== true) process.exit(6);
            if (!j.posture?.noAutoRemediate) process.exit(7);
            if (!j.posture?.noPoC) process.exit(8);
            if (!j.posture?.secretsRedacted) process.exit(9);
            if (!j.posture?.classificationNotExploitability) process.exit(10);
            const md = require("fs").readFileSync("zeroday-reports/ci-classify/classify.md", "utf8");
            if (!/Classification ≠ exploitability/i.test(md)) process.exit(11);
            if (!/Human review required/i.test(md)) process.exit(12);
            const blob = JSON.stringify(j);
            if (/sk_[A-Za-z0-9]{10,}/.test(blob)) process.exit(13);
            console.log("classify fixture OK", j.classification, j.evidence?.length, "evidence");
          '

      - name: Classify ambiguous → needs_human + --fixture path
        run: |
          set -euo pipefail
          npm run zeroday -- classify --from fixtures/classify/needs_human \
            --output zeroday-reports/ci-classify-ambiguous
          node -e '
            const j = require("./zeroday-reports/ci-classify-ambiguous/classify.json");
            if (j.classification !== "needs_human") process.exit(2);
            if (!/Ambiguous/i.test((j.rationale || []).join(" "))) process.exit(3);
            console.log("ambiguous → needs_human OK");
          '
          npm run zeroday -- classify --fixture --output zeroday-reports/ci-classify-fixture
          test -f zeroday-reports/ci-classify-fixture/classify.json

      - name: Summarize classify gate
        run: |
          {
            echo "## ZERODAY classify gate (Desk slice E)"
            echo ""
            echo "- Mode: crash classify + evidence from fixture dir (offline)"
            echo "- Output: \`zeroday-reports/ci-classify/\`"
            echo "- Labels: possible_breach | infra_failure | software_defect | agent_misfire | needs_human"
            echo "- Ambiguous → needs_human · classification ≠ exploitability"
            echo "- No auto-remediate · no PoC · secrets redacted · human review required"
            echo "- mvp / inventory / packet / harden unchanged"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload classify artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zeroday-classify-reports
          path: |
            zeroday-reports/ci-classify/
            zeroday-reports/ci-classify-ambiguous/
            zeroday-reports/ci-classify-fixture/
          if-no-files-found: error

  craft:
    name: Fixture defensive craft (Desk slice D)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Craft from Desk B→A→C→E reports (generate-only)
        run: |
          set -euo pipefail
          npm run zeroday -- craft --from docs/reports \
            --output zeroday-reports/ci-craft
          test -f zeroday-reports/ci-craft/craft.json
          test -f zeroday-reports/ci-craft/craft.md
          test -f zeroday-reports/ci-craft/README.md
          test -f zeroday-reports/ci-craft/SOURCE.md
          test -d zeroday-reports/ci-craft/skills
          test -d zeroday-reports/ci-craft/plugins
          test "$(find zeroday-reports/ci-craft/skills -name 'SKILL.md' | wc -l)" -ge 1
          test "$(find zeroday-reports/ci-craft/plugins -name 'plugin.json' | wc -l)" -ge 1
          node -e '
            const fs = require("fs");
            const j = require("./zeroday-reports/ci-craft/craft.json");
            if (j.schemaVersion !== "zeroday-craft-scaffold/v1") process.exit(2);
            if (j.desk !== "D") process.exit(3);
            if (!j.posture?.generateOnly) process.exit(4);
            if (!j.posture?.noAutoInstall) process.exit(5);
            if (!j.posture?.noMarketplacePublish) process.exit(6);
            if (!j.posture?.noPoC) process.exit(7);
            if (!j.posture?.refusesOffensive) process.exit(8);
            if (!Array.isArray(j.patterns) || j.patterns.length < 5) process.exit(9);
            if (!Array.isArray(j.scaffolds) || j.scaffolds.length < 2) process.exit(10);
            const stages = new Set(j.patterns.map((p) => p.stage));
            for (const s of ["inventory","locate","packet","harden","classify"]) {
              if (!stages.has(s)) process.exit(11);
            }
            const skill = fs.readFileSync(
              "zeroday-reports/ci-craft/skills/zeroday-defensive-operator/SKILL.md",
              "utf8",
            );
            if (!/inventory/i.test(skill) || !/classify/i.test(skill)) process.exit(12);
            if (!/auto-install/i.test(skill)) process.exit(13);
            const blob = JSON.stringify(j) + skill;
            if (/sk_[A-Za-z0-9]{10,}/.test(blob)) process.exit(14);
            if (/\b(write|craft)\s+an?\s+exploit\b/i.test(blob)) process.exit(15);
            console.log("craft fixture OK", j.patterns.length, "patterns", j.scaffolds.length, "scaffolds");
          '

      - name: Craft refuses offensive skill name
        run: |
          set -euo pipefail
          set +e
          npm run zeroday -- craft --fixture --name exploit-kit-skill \
            --output zeroday-reports/ci-craft-refuse
          code=$?
          set -e
          test "$code" -eq 3
          test ! -f zeroday-reports/ci-craft-refuse/craft.json

      - name: Skill + plugin aliases
        run: |
          set -euo pipefail
          npm run zeroday -- skill --fixture --output zeroday-reports/ci-craft-skill
          test -d zeroday-reports/ci-craft-skill/skills
          test ! -d zeroday-reports/ci-craft-skill/plugins
          npm run zeroday -- plugin --fixture --output zeroday-reports/ci-craft-plugin
          test -d zeroday-reports/ci-craft-plugin/plugins
          test ! -d zeroday-reports/ci-craft-plugin/skills

      - name: Summarize craft gate
        run: |
          {
            echo "## ZERODAY craft gate (Desk slice D)"
            echo ""
            echo "- Mode: generate-only skill + plugin scaffolds from Desk B→A→C→E reports"
            echo "- Output: \`zeroday-reports/ci-craft/\`"
            echo "- No auto-install · no marketplace publish"
            echo "- Refuses exploits, PoCs, and offensive skill patterns"
            echo "- Posture: defensive habits · localization only · needs human"
            echo "- mvp / inventory / packet / harden / classify unchanged"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload craft artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zeroday-craft-reports
          path: |
            zeroday-reports/ci-craft/
            zeroday-reports/ci-craft-skill/
            zeroday-reports/ci-craft-plugin/
          if-no-files-found: error
