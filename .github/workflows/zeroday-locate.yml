# ZERODAY Antares localization CI gate
#
# Fixture-only — no model weights, no HF pull, no GPU.
# Jobs: locate (SARIF + PR comment) + operate→verify (keyless evidence vault).
# Never auto-merges. Localization ≠ exploitability.

name: ZERODAY locate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  pull-requests: write

concurrency:
  group: zeroday-locate-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  locate:
    name: CI/no-GPU fixture localize → SARIF + PR comment
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: List PR diff (context only)
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: |
          set -euo pipefail
          echo "## PR changed files (context — CI/no-GPU fixture locate uses recorded Antares run)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          git fetch origin "${{ github.base_ref }}" --depth=1 2>/dev/null || true
          git diff --name-only "origin/${{ github.base_ref }}...HEAD" | head -100 | sed 's/^/- /' >> "$GITHUB_STEP_SUMMARY" || true

      - name: ZERODAY locate gate
        uses: ./.github/actions/zeroday-locate-gate
        with:
          cwe: CWE-89
          repo: fixtures/locate/demo-app
          output: zeroday-reports/ci
          fail-on-findings: ${{ vars.ZERODAY_FAIL_ON_FINDINGS || 'false' }}
          upload-sarif: "true"
          post-comment: "true"
          sarif-category: zeroday-antares-fixture

      - name: Upload report artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zeroday-locate-reports
          path: zeroday-reports/ci/
          if-no-files-found: error

  operate:
    name: Fixture operate → verify (keyless)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fixture operate (no weights / no GPU)
        run: |
          set -euo pipefail
          mkdir -p zeroday-reports/ci-operate
          npm run zeroday -- operate --cwe CWE-89 --fixture --offline \
            --output zeroday-reports/ci-operate
          test -f zeroday-reports/ci-operate/report.json
          test -f zeroday-reports/ci-operate/report.sarif
          test -f zeroday-reports/ci-operate/evidence/manifest.json

      - name: Verify evidence vault (fail on hash/schema errors)
        run: |
          set -euo pipefail
          npm run zeroday -- verify --from zeroday-reports/ci-operate

      - name: Summarize operate gate
        run: |
          {
            echo "## ZERODAY operate → verify gate"
            echo ""
            echo "- Mode: fixture agent operator (keyless — no Antares HF token / no GPU)"
            echo "- Output: \`zeroday-reports/ci-operate/\`"
            echo "- Verify: offline SHA-256 + manifest schema (hard-fail)"
            echo "- Posture: localization only · not exploit proof · no auto-merge"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload operate artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zeroday-operate-reports
          path: zeroday-reports/ci-operate/
          if-no-files-found: error

  inventory:
    name: Fixture multi-repo inventory (Desk slice B)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Multi-repo inventory (fixture only)
        run: |
          set -euo pipefail
          npm run zeroday -- inventory --from fixtures/inventory/desk-b/manifest.json \
            --output zeroday-reports/ci-inventory
          test -f zeroday-reports/ci-inventory/inventory.json
          test -f zeroday-reports/ci-inventory/inventory.md
          test -f zeroday-reports/ci-inventory/inventory.sarif
          test -f zeroday-reports/ci-inventory/case-note.md
          test -f zeroday-reports/ci-inventory/repos/webuzz/inventory.json
          # Explicit --fixture door (same desk-b manifest)
          npm run zeroday -- inventory --fixture \
            --output zeroday-reports/ci-inventory-fixture-flag
          test -f zeroday-reports/ci-inventory-fixture-flag/inventory.json
          node -e '
            const j = require("./zeroday-reports/ci-inventory/inventory.json");
            if (j.schemaVersion !== "zeroday-config-inventory/v1") process.exit(2);
            if (j.repoCount < 5) process.exit(3);
            if (!j.rankedHotspots?.length) process.exit(4);
            if (!j.posture?.inventoryOnly) process.exit(5);
            if (!Array.isArray(j.findings)) process.exit(6);
            if (!j.skipped?.some((s) => s.id === "EternalEcho")) process.exit(7);
            const blob = JSON.stringify(j.findings);
            if (/sk_[A-Za-z0-9]{10,}/.test(blob)) process.exit(8);
            console.log("inventory fixture OK", j.repoCount, "repos", j.findings.length, "findings", j.skipped.length, "skipped");
          '

      - name: Summarize inventory gate
        run: |
          {
            echo "## ZERODAY inventory gate (Desk slice B)"
            echo ""
            echo "- Mode: fixture multi-repo + config surfaces (no GPU / no HF)"
            echo "- Output: \`zeroday-reports/ci-inventory/\`"
            echo "- Feeds locate — not exploit scanning"
            echo "- Posture: inventory only · localization only · no PoC · no auto-merge"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload inventory artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zeroday-inventory-reports
          path: zeroday-reports/ci-inventory/
          if-no-files-found: error

  desk-real:
    name: Desk on real-shaped path (Keyless K5)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Inventory → packet → harden on real-shaped tree (no Antares)
        run: |
          set -euo pipefail
          # Mirrors: cd my-app && npm run zeroday -- inventory
          npm run zeroday -- inventory --repo fixtures/inventory/real-shaped \
            --output zeroday-reports/ci-desk-real-inv
          test -f zeroday-reports/ci-desk-real-inv/inventory.json
          test -f zeroday-reports/ci-desk-real-inv/inventory.sarif
          # Default --from resolution prefers zeroday-reports/
          npm run zeroday -- packet --output zeroday-reports/ci-desk-real-packet
          test -f zeroday-reports/ci-desk-real-packet/packet.json
          npm run zeroday -- harden --from zeroday-reports/ci-desk-real-packet \
            --output zeroday-reports/ci-desk-real-harden
          test -f zeroday-reports/ci-desk-real-harden/harden.json
          node -e '
            const inv = require("./zeroday-reports/ci-desk-real-inv/inventory.json");
            if (!inv.configHotspots?.length) process.exit(2);
            const pkt = require("./zeroday-reports/ci-desk-real-packet/packet.json");
            if (pkt.schemaVersion !== "zeroday-security-packet/v1") process.exit(3);
            const h = require("./zeroday-reports/ci-desk-real-harden/harden.json");
            if (h.schemaVersion !== "zeroday-harden-recommendations/v1") process.exit(4);
            console.log("desk-real OK", inv.configHotspots.length, "hotspots", pkt.findings.length, "findings");
          '

      - name: Summarize desk-real gate
        run: |
          {
            echo "## ZERODAY Desk on real path (Keyless K5)"
            echo ""
            echo "- Mode: inventory/packet/harden against \`fixtures/inventory/real-shaped\` (mirrors cwd usage)"
            echo "- No Antares · no PoC · Desk ≠ vuln discovery"
            echo "- Fixture smoke unchanged: \`inventory --fixture\` / \`npm run mvp\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload desk-real artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zeroday-desk-real-reports
          path: |
            zeroday-reports/ci-desk-real-inv/
            zeroday-reports/ci-desk-real-packet/
            zeroday-reports/ci-desk-real-harden/
          if-no-files-found: error

  packet:
    name: Fixture security packet (Desk slice A)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Security packet from Desk B reports (generate only)
        run: |
          set -euo pipefail
          npm run zeroday -- packet --from docs/reports \
            --output zeroday-reports/ci-packet
          test -f zeroday-reports/ci-packet/packet.json
          test -f zeroday-reports/ci-packet/summary.md
          test -f zeroday-reports/ci-packet/findings.json
          test -f zeroday-reports/ci-packet/findings.md
          test -f zeroday-reports/ci-packet/README.md
          test -f zeroday-reports/ci-packet/desk-b-inventory.sarif
          node -e '
            const j = require("./zeroday-reports/ci-packet/packet.json");
            if (j.schemaVersion !== "zeroday-security-packet/v1") process.exit(2);
            if (j.desk !== "A") process.exit(3);
            if (!j.posture?.noAutoSend) process.exit(4);
            if (!j.posture?.noPoC) process.exit(5);
            if (!Array.isArray(j.findings) || j.findings.length < 1) process.exit(6);
            const labels = new Set(["agent-misfire","config","dependency","unknown"]);
            for (const f of j.findings) {
              if (!labels.has(f.classification)) process.exit(7);
              if (!f.classificationBasis) process.exit(8);
            }
            const blob = JSON.stringify(j);
            if (/sk_[A-Za-z0-9]{10,}/.test(blob)) process.exit(9);
            if (/auto-?post|slack webhook|mailto:/i.test(blob) && /sendNow|dispatch/i.test(blob)) process.exit(10);
            console.log("packet fixture OK", j.findings.length, "findings", j.classificationCounts);
          '

      - name: Summarize packet gate
        run: |
          {
            echo "## ZERODAY security packet gate (Desk slice A)"
            echo ""
            echo "- Mode: package Desk B inventory reports → offline share folder"
            echo "- Output: \`zeroday-reports/ci-packet/\`"
            echo "- Generate only — no Slack / GH / email auto-send"
            echo "- Posture: localize + evidence + harden · no PoC · secrets redacted"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload packet artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zeroday-security-packet
          path: zeroday-reports/ci-packet/
          if-no-files-found: error

  harden:
    name: Fixture harden recommendations (Desk slice C)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Harden from Desk B reports (recommend-only)
        run: |
          set -euo pipefail
          npm run zeroday -- harden --from docs/reports \
            --output zeroday-reports/ci-harden
          test -f zeroday-reports/ci-harden/harden.json
          test -f zeroday-reports/ci-harden/harden.md
          test -f zeroday-reports/ci-harden/README.md
          test ! -d zeroday-reports/ci-harden/drafts
          node -e '
            const j = require("./zeroday-reports/ci-harden/harden.json");
            if (j.schemaVersion !== "zeroday-harden-recommendations/v1") process.exit(2);
            if (j.desk !== "C") process.exit(3);
            if (!j.posture?.recommendationsOnly) process.exit(4);
            if (!j.posture?.noAutoApply) process.exit(5);
            if (!j.posture?.noAutoPr) process.exit(6);
            if (!j.posture?.noAutoMerge) process.exit(7);
            if (!j.posture?.noPoC) process.exit(8);
            if (!Array.isArray(j.recommendations) || j.recommendations.length < 1) process.exit(9);
            if (j.draftNotes?.length) process.exit(10);
            const cats = new Set(["agent-harness","package-scripts","secrets-hygiene","config-surface"]);
            for (const r of j.recommendations) {
              if (!cats.has(r.category)) process.exit(11);
              if (!r.evidence?.findingId) process.exit(12);
            }
            const blob = JSON.stringify(j);
            if (/sk_[A-Za-z0-9]{10,}/.test(blob)) process.exit(13);
            console.log("harden fixture OK", j.recommendations.length, "recs", j.categoryCounts);
          '

      - name: Harden --draft notes (human-gated, still no auto-apply)
        run: |
          set -euo pipefail
          npm run zeroday -- harden --from docs/reports/desk-a-packet \
            --draft --output zeroday-reports/ci-harden-draft
          test -f zeroday-reports/ci-harden-draft/harden.json
          test -d zeroday-reports/ci-harden-draft/drafts
          test "$(find zeroday-reports/ci-harden-draft/drafts -name '*.md' | wc -l)" -ge 1
          node -e '
            const j = require("./zeroday-reports/ci-harden-draft/harden.json");
            if (!j.posture?.noAutoApply || !j.posture?.noAutoPr || !j.posture?.noAutoMerge) process.exit(2);
            if (!j.draftNotes?.length) process.exit(3);
            const draft = require("fs").readdirSync("zeroday-reports/ci-harden-draft/drafts")[0];
            const md = require("fs").readFileSync("zeroday-reports/ci-harden-draft/drafts/" + draft, "utf8");
            if (!/DRAFT ONLY/i.test(md)) process.exit(4);
            if (/CodeGuard-approved/i.test(md)) process.exit(5);
            if (/\b(write|craft)\s+an?\s+exploit\b/i.test(md)) process.exit(6);
            console.log("harden draft OK", j.draftNotes.length, "notes");
          '

      - name: Summarize harden gate
        run: |
          {
            echo "## ZERODAY harden gate (Desk slice C)"
            echo ""
            echo "- Mode: recommend-only from Desk B/A reports (optional --draft notes)"
            echo "- Output: \`zeroday-reports/ci-harden/\`"
            echo "- No auto-apply · no auto-PR · no auto-merge"
            echo "- Posture: localize + evidence + harden · no PoC · secrets redacted"
            echo "- mvp / inventory / packet unchanged"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload harden artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zeroday-harden-reports
          path: |
            zeroday-reports/ci-harden/
            zeroday-reports/ci-harden-draft/
          if-no-files-found: error

  classify:
    name: Fixture crash classify + evidence (Desk slice E)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Classify from fixture dir (one command)
        run: |
          set -euo pipefail
          npm run zeroday -- classify --from fixtures/classify/software_defect \
            --output zeroday-reports/ci-classify
          test -f zeroday-reports/ci-classify/classify.json
          test -f zeroday-reports/ci-classify/classify.md
          test -f zeroday-reports/ci-classify/ciso.json
          test -f zeroday-reports/ci-classify/ciso.md
          test -f zeroday-reports/ci-classify/README.md
          node -e '
            const j = require("./zeroday-reports/ci-classify/classify.json");
            if (j.schemaVersion !== "zeroday-classify-evidence/v1") process.exit(2);
            if (j.desk !== "E") process.exit(3);
            if (j.classification !== "software_defect") process.exit(4);
            if (j.needs_human !== true) process.exit(5);
            if (j.classification_not_exploitability !== true) process.exit(6);
            if (!j.posture?.noAutoRemediate) process.exit(7);
            if (!j.posture?.noPoC) process.exit(8);
            if (!j.posture?.secretsRedacted) process.exit(9);
            if (!j.posture?.classificationNotExploitability) process.exit(10);
            const md = require("fs").readFileSync("zeroday-reports/ci-classify/classify.md", "utf8");
            if (!/Classification ≠ exploitability/i.test(md)) process.exit(11);
            if (!/Human review required/i.test(md)) process.exit(12);
            const blob = JSON.stringify(j);
            if (/sk_[A-Za-z0-9]{10,}/.test(blob)) process.exit(13);
            console.log("classify fixture OK", j.classification, j.evidence?.length, "evidence");
          '

      - name: Classify ambiguous → needs_human + --fixture path
        run: |
          set -euo pipefail
          npm run zeroday -- classify --from fixtures/classify/needs_human \
            --output zeroday-reports/ci-classify-ambiguous
          node -e '
            const j = require("./zeroday-reports/ci-classify-ambiguous/classify.json");
            if (j.classification !== "needs_human") process.exit(2);
            if (!/Ambiguous/i.test((j.rationale || []).join(" "))) process.exit(3);
            console.log("ambiguous → needs_human OK");
          '
          npm run zeroday -- classify --fixture --output zeroday-reports/ci-classify-fixture
          test -f zeroday-reports/ci-classify-fixture/classify.json

      - name: Summarize classify gate
        run: |
          {
            echo "## ZERODAY classify gate (Desk slice E)"
            echo ""
            echo "- Mode: crash classify + evidence from fixture dir (offline)"
            echo "- Output: \`zeroday-reports/ci-classify/\`"
            echo "- Labels: possible_breach | infra_failure | software_defect | agent_misfire | needs_human"
            echo "- Ambiguous → needs_human · classification ≠ exploitability"
            echo "- No auto-remediate · no PoC · secrets redacted · human review required"
            echo "- mvp / inventory / packet / harden unchanged"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload classify artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zeroday-classify-reports
          path: |
            zeroday-reports/ci-classify/
            zeroday-reports/ci-classify-ambiguous/
            zeroday-reports/ci-classify-fixture/
          if-no-files-found: error

  craft:
    name: Fixture defensive craft (Desk slice D)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Craft from Desk B→A→C→E reports (generate-only)
        run: |
          set -euo pipefail
          npm run zeroday -- craft --from docs/reports \
            --output zeroday-reports/ci-craft
          test -f zeroday-reports/ci-craft/craft.json
          test -f zeroday-reports/ci-craft/craft.md
          test -f zeroday-reports/ci-craft/README.md
          test -f zeroday-reports/ci-craft/SOURCE.md
          test -d zeroday-reports/ci-craft/skills
          test -d zeroday-reports/ci-craft/plugins
          test "$(find zeroday-reports/ci-craft/skills -name 'SKILL.md' | wc -l)" -ge 1
          test "$(find zeroday-reports/ci-craft/plugins -name 'plugin.json' | wc -l)" -ge 1
          node -e '
            const fs = require("fs");
            const j = require("./zeroday-reports/ci-craft/craft.json");
            if (j.schemaVersion !== "zeroday-craft-scaffold/v1") process.exit(2);
            if (j.desk !== "D") process.exit(3);
            if (!j.posture?.generateOnly) process.exit(4);
            if (!j.posture?.noAutoInstall) process.exit(5);
            if (!j.posture?.noMarketplacePublish) process.exit(6);
            if (!j.posture?.noPoC) process.exit(7);
            if (!j.posture?.refusesOffensive) process.exit(8);
            if (!Array.isArray(j.patterns) || j.patterns.length < 5) process.exit(9);
            if (!Array.isArray(j.scaffolds) || j.scaffolds.length < 2) process.exit(10);
            const stages = new Set(j.patterns.map((p) => p.stage));
            for (const s of ["inventory","locate","packet","harden","classify"]) {
              if (!stages.has(s)) process.exit(11);
            }
            const skill = fs.readFileSync(
              "zeroday-reports/ci-craft/skills/zeroday-defensive-operator/SKILL.md",
              "utf8",
            );
            if (!/inventory/i.test(skill) || !/classify/i.test(skill)) process.exit(12);
            if (!/auto-install/i.test(skill)) process.exit(13);
            const blob = JSON.stringify(j) + skill;
            if (/sk_[A-Za-z0-9]{10,}/.test(blob)) process.exit(14);
            if (/\b(write|craft)\s+an?\s+exploit\b/i.test(blob)) process.exit(15);
            console.log("craft fixture OK", j.patterns.length, "patterns", j.scaffolds.length, "scaffolds");
          '

      - name: Craft refuses offensive skill name
        run: |
          set -euo pipefail
          set +e
          npm run zeroday -- craft --fixture --name exploit-kit-skill \
            --output zeroday-reports/ci-craft-refuse
          code=$?
          set -e
          test "$code" -eq 3
          test ! -f zeroday-reports/ci-craft-refuse/craft.json

      - name: Skill + plugin aliases
        run: |
          set -euo pipefail
          npm run zeroday -- skill --fixture --output zeroday-reports/ci-craft-skill
          test -d zeroday-reports/ci-craft-skill/skills
          test ! -d zeroday-reports/ci-craft-skill/plugins
          npm run zeroday -- plugin --fixture --output zeroday-reports/ci-craft-plugin
          test -d zeroday-reports/ci-craft-plugin/plugins
          test ! -d zeroday-reports/ci-craft-plugin/skills

      - name: Summarize craft gate
        run: |
          {
            echo "## ZERODAY craft gate (Desk slice D)"
            echo ""
            echo "- Mode: generate-only skill + plugin scaffolds from Desk B→A→C→E reports"
            echo "- Output: \`zeroday-reports/ci-craft/\`"
            echo "- No auto-install · no marketplace publish"
            echo "- Refuses exploits, PoCs, and offensive skill patterns"
            echo "- Posture: defensive habits · localization only · needs human"
            echo "- mvp / inventory / packet / harden / classify unchanged"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload craft artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zeroday-craft-reports
          path: |
            zeroday-reports/ci-craft/
            zeroday-reports/ci-craft-skill/
            zeroday-reports/ci-craft-plugin/
          if-no-files-found: error
