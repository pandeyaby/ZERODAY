# ZERODAY Antares localization CI gate
#
# Fixture-only — no model weights, no HF pull, no GPU.
# Jobs: locate (SARIF + PR comment) + operate→verify (keyless evidence vault).
# Never auto-merges. Localization ≠ exploitability.

name: ZERODAY locate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  pull-requests: write

concurrency:
  group: zeroday-locate-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  locate:
    name: Fixture localize → SARIF + PR comment
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: List PR diff (context only)
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: |
          set -euo pipefail
          echo "## PR changed files (context — fixture locate uses recorded Antares run)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          git fetch origin "${{ github.base_ref }}" --depth=1 2>/dev/null || true
          git diff --name-only "origin/${{ github.base_ref }}...HEAD" | head -100 | sed 's/^/- /' >> "$GITHUB_STEP_SUMMARY" || true

      - name: ZERODAY locate gate
        uses: ./.github/actions/zeroday-locate-gate
        with:
          cwe: CWE-89
          repo: fixtures/locate/demo-app
          output: zeroday-reports/ci
          fail-on-findings: ${{ vars.ZERODAY_FAIL_ON_FINDINGS || 'false' }}
          upload-sarif: "true"
          post-comment: "true"
          sarif-category: zeroday-antares-fixture

      - name: Upload report artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zeroday-locate-reports
          path: zeroday-reports/ci/
          if-no-files-found: error

  operate:
    name: Fixture operate → verify (keyless)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fixture operate (no weights / no GPU)
        run: |
          set -euo pipefail
          mkdir -p zeroday-reports/ci-operate
          npm run zeroday -- operate --cwe CWE-89 --fixture --offline \
            --output zeroday-reports/ci-operate
          test -f zeroday-reports/ci-operate/report.json
          test -f zeroday-reports/ci-operate/report.sarif
          test -f zeroday-reports/ci-operate/evidence/manifest.json

      - name: Verify evidence vault (fail on hash/schema errors)
        run: |
          set -euo pipefail
          npm run zeroday -- verify --from zeroday-reports/ci-operate

      - name: Summarize operate gate
        run: |
          {
            echo "## ZERODAY operate → verify gate"
            echo ""
            echo "- Mode: fixture agent operator (keyless — no Antares HF token / no GPU)"
            echo "- Output: \`zeroday-reports/ci-operate/\`"
            echo "- Verify: offline SHA-256 + manifest schema (hard-fail)"
            echo "- Posture: localization only · not exploit proof · no auto-merge"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload operate artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zeroday-operate-reports
          path: zeroday-reports/ci-operate/
          if-no-files-found: error
