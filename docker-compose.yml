services:
  zeroday:
    build: .
    ports:
      # Loopback only: the Desk trusts a localhost Host header, so never publish
      # this port on a LAN interface without ZERODAY_UI_ALLOWED_HOSTS + ZERODAY_UI_TOKEN.
      - "127.0.0.1:3000:3000"
    environment:
      - ZERODAY_DATA_DIR=/data
    volumes:
      - zeroday-data:/data
    restart: unless-stopped

volumes:
  zeroday-data:
